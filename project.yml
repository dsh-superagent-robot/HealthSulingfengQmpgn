name: Heartica
options:
  bundleIdPrefix: com.silverdawn.frostyhill
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "582"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
targets:
  Heartica:
    type: application
    platform: iOS
    sources:
      - path: Heartica
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.silverdawn.frostyhill.myst
        PRODUCT_NAME: Heartica
        INFOPLIST_FILE: Heartica/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Heartica/Resources/Info.plist
      properties:
        CFBundleDisplayName: Heartica
        CFBundleName: Heartica
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "582"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Heartica uses the camera to detect your pulse from your fingertip.
        NSPhotoLibraryUsageDescription: Heartica lets you choose a profile photo from your library.
        NSPhotoLibraryAddUsageDescription: Heartica can save images you share from the app.
        NSHealthShareUsageDescription: Heartica reads heart rate variability, workouts, mindfulness and sleep data to enrich your insights.
        NSHealthUpdateUsageDescription: Heartica keeps your health metrics in sync with Apple Health.
        CFBundleURLTypes:
          - CFBundleURLName: com.silverdawn.frostyhill.myst
            CFBundleURLSchemes:
              - heartica
              - HeartRate
    scheme:
      testTargets:
        - HearticaTests
      gatherCoverageData: false
  HearticaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HearticaTests
    dependencies:
      - target: Heartica
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.silverdawn.frostyhill.myst.tests
        GENERATE_INFOPLIST_FILE: YES
